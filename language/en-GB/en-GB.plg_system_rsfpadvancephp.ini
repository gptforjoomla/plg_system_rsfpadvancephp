PLG_SYSTEM_RSFPADVANCEPHP="Advance PHP for RSForm!Pro"
PLG_SYSTEM_RSFPADVANCEPHP_DESC="Advance PHP for RSForm!Pro adds administrator-managed PHP snippets for five custom RSForm!Pro event points that are not duplicated by current RSForm!Pro native scripting features."
PLG_SYSTEM_RSFPADVANCEPHP_HEADDING="Select who can access the Advance PHP scripts"
PLG_SYSTEM_RSFPADVANCEPHP_TARGET_GROUPS_LABEL="Access Groups"
PLG_SYSTEM_RSFPADVANCEPHP_TARGET_GROUPS_DESC="User groups that can access the Advance PHP settings inside the RSForm!Pro form editor. If no group is selected, access is allowed."
PLG_SYSTEM_RSFPADVANCEPHP_CONFIG_TAB="Advance PHP [VDM]"
PLG_SYSTEM_RSFPADVANCEPHP_CONFIG_NOTICE="<h1>Advance PHP</h1><p>This Joomla 6 version keeps only the five custom RSForm!Pro event hooks that are not already provided by current RSForm!Pro native scripting features.</p>"
PLG_SYSTEM_RSFPADVANCEPHP_JOOMLA_PROFILE_TAB="Advance PHP [VDM]"
PLG_SYSTEM_RSFPADVANCEPHP_ADMIN_INTRO="Enable one or more retained custom RSForm!Pro events and enter PHP code without opening or closing PHP tags. Legacy stored code for removed native RSForm!Pro event slots is preserved but is not executed by this plugin."
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE="Activate:"
PLG_SYSTEM_RSFPADVANCEPHP_CODE_LABEL="PHP code"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE="You can modify the documented event context with PHP code in the box below. Do not include opening or closing PHP tags."
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_A="Removed: before form initialization"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_B="Removed: before form display"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_C="Removed: before form validation, after submission"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_D="Removed: before form process, after submission"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_E="On Before Store Submissions"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_F="On After Store Submissions"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_G="Removed: after form has been processed"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_H="On After Show Thankyou Message"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_I="On After Create Placeholders"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_J="Removed: before user email is sent"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_K="Removed: before admin email is sent"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_L="Removed: before additional email is sent"
PLG_SYSTEM_RSFPADVANCEPHP_ACTIVE_M="On After Confirm Payment"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_A="$args = array('find' => &$find, 'replace' => &$replace, 'formLayout' => &$formLayout)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_B="$args = array('formLayout' => &$formLayout, 'formId' => $formId)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_C="$args = array('invalid' => &$invalid, 'formId' => $formId, 'post' => &$post)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_D="$args = array('post' => &$post)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_E="$args = array('formId' => $formId, 'post' => &$post, 'SubmissionId' => $SubmissionId)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_F="$args = array('SubmissionId' => $SubmissionId, 'formId' => $formId)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_G="$args = array('SubmissionId' => $SubmissionId, 'formId' => $formId)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_H="$args = array('output' => &$output, 'formId' => &$formId)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_I="$args = array('form' => &$form, 'placeholders' => &$placeholders, 'values' => &$values, 'submission' => $submission)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_J="$args = array('form' => &$form, 'placeholders' => &$placeholders, 'values' => &$values, 'submissionId' => $SubmissionId, 'userEmail' => &$userEmail)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_K="$args = array('form' => &$form, 'placeholders' => &$placeholders, 'values' => &$values, 'submissionId' => $SubmissionId, 'adminEmail' => &$adminEmail)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_L="$args = array('form' => &$form, 'placeholders' => &$placeholders, 'values' => &$values, 'submissionId' => $SubmissionId, 'additionalEmail' => &$additionalEmail)"
PLG_SYSTEM_RSFPADVANCEPHP_NOTICE_M="$SubmissionId = 'SubmissionId'"
